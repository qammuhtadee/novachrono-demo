<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
<script>
  const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#1d2b53',
    scene: { create: function () {
      this.add.text(20, 20, 'Hello Phaser', { fontSize: '32px', color: '#ffffff' });
    } }
  };
  new Phaser.Game(config);
</script>
</body>
</html>
